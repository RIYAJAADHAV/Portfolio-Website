<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Resume of Riya Jadhav — software developer and QA engineer portfolio resume preview."
    />
    <title>Resume | Riya Jadhav</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #070b14;
        --bg-elevated: rgba(13, 18, 31, 0.8);
        --panel: rgba(15, 20, 31, 0.8);
        --panel-strong: #0d1322;
        --panel-border: rgba(153, 169, 201, 0.18);
        --text: #edf3ff;
        --muted: #9aa9c4;
        --muted-strong: #c7d1ea;
        --primary: #8b5cf6;
        --secondary: #ff5ec4;
        --accent: #7dd3fc;
        --shadow: rgba(2, 6, 23, 0.75);
        --grid: rgba(148, 163, 184, 0.09);
      }

      * { box-sizing: border-box; }
      html { scroll-behavior: smooth; }
      body {
        margin: 0;
        background:
          radial-gradient(circle at 15% 20%, rgba(139, 92, 246, 0.2), transparent 30%),
          radial-gradient(circle at 80% 10%, rgba(255, 94, 196, 0.12), transparent 24%),
          var(--bg);
        color: var(--text);
        font-family: 'Inter', sans-serif;
        line-height: 1.6;
      }
      a { color: inherit; text-decoration: none; }
      button, a { font: inherit; }

      .page-shell {
        min-height: 100vh;
        position: relative;
        overflow: hidden;
      }
      .page-shell::before {
        content: "";
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(var(--grid) 1px, transparent 1px),
          linear-gradient(90deg, var(--grid) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(circle at center, black 40%, transparent 100%);
        pointer-events: none;
        opacity: 0.35;
      }
      .container {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
        position: relative;
        z-index: 1;
      }

      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        backdrop-filter: blur(18px);
        background: rgba(7, 11, 20, 0.7);
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      }
      .nav-wrap {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 76px;
        gap: 20px;
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 12px;
        font-weight: 700;
        letter-spacing: 0.02em;
      }
      .brand-mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 38px;
        height: 38px;
        border-radius: 12px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        box-shadow: 0 16px 28px rgba(139, 92, 246, 0.35);
        font-size: 0.82rem;
      }
      .brand-text {
        color: var(--text);
        font-size: 0.95rem;
      }
      .main-nav {
        display: flex;
        align-items: center;
        gap: clamp(12px, 1.5vw, 26px);
        color: var(--muted);
        font-size: 0.95rem;
      }
      .main-nav a {
        position: relative;
        transition: color 0.2s ease;
      }
      .main-nav a::after {
        content: "";
        position: absolute;
        left: 0;
        bottom: -8px;
        width: 100%;
        height: 2px;
        background: linear-gradient(90deg, var(--primary), var(--secondary));
        opacity: 0;
        transform: scaleX(0.4);
        transition: all 0.2s ease;
      }
      .main-nav a:hover,
      .main-nav a:focus-visible,
      .main-nav a[aria-current="page"] {
        color: var(--text);
      }
      .main-nav a:hover::after,
      .main-nav a:focus-visible::after,
      .main-nav a[aria-current="page"]::after {
        opacity: 1;
        transform: scaleX(1);
      }
      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 46px;
        padding: 0 22px;
        border: 1px solid transparent;
        border-radius: 999px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        color: #fff;
        font-weight: 700;
        box-shadow: 0 16px 30px rgba(139, 92, 246, 0.25);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      }
      .button:hover,
      .button:focus-visible {
        transform: translateY(-1px);
        box-shadow: 0 20px 35px rgba(139, 92, 246, 0.35);
      }
      .button-small {
        min-height: 42px;
        padding: 0 18px;
        font-size: 0.9rem;
      }
      .button-secondary {
        background: rgba(15, 20, 31, 0.7);
        border-color: rgba(148, 163, 184, 0.18);
        box-shadow: none;
      }
      .nav-toggle {
        display: none;
        width: 46px;
        height: 46px;
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 12px;
        background: rgba(15, 20, 31, 0.7);
        padding: 10px 12px;
        cursor: pointer;
      }
      .nav-toggle span {
        display: block;
        width: 100%;
        height: 2px;
        background: var(--text);
        margin: 5px 0;
        transition: transform 0.2s ease, opacity 0.2s ease;
      }

      .resume-page {
        min-height: 100vh;
      }
      .resume-layout {
        padding: 52px 0 80px;
      }
      .resume-card {
        background: rgba(15, 20, 31, 0.7);
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 28px;
        box-shadow: 0 24px 60px rgba(2, 6, 23, 0.38);
        overflow: hidden;
      }
      .resume-toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding: 28px 28px 20px;
        border-bottom: 1px solid rgba(148, 163, 184, 0.08);
      }
      .eyebrow {
        margin: 0 0 14px;
        font-size: 0.75rem;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: #d8b4fe;
        font-weight: 700;
      }
      .resume-toolbar h1 {
        margin: 8px 0 0;
        font-size: clamp(2rem, 3vw, 3rem);
        line-height: 1.1;
        letter-spacing: -0.05em;
      }
      .resume-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 12px;
        justify-content: flex-end;
      }
      .resume-preview-shell {
        padding: 20px 18px 24px;
      }
      .resume-frame {
        display: block;
        width: 100%;
        min-height: 80vh;
        border: 1px solid rgba(148, 163, 184, 0.12);
        border-radius: 18px;
        background: #ffffff;
      }

      @media (max-width: 840px) {
        .nav-toggle {
          display: block;
        }
        .main-nav {
          position: absolute;
          top: calc(100% + 10px);
          right: 16px;
          left: 16px;
          display: none;
          flex-direction: column;
          align-items: flex-start;
          padding: 18px 16px;
          border: 1px solid rgba(148, 163, 184, 0.12);
          border-radius: 16px;
          background: rgba(10, 15, 26, 0.96);
          box-shadow: 0 18px 38px rgba(2, 6, 23, 0.38);
        }
        .main-nav.is-open { display: flex; }
        .nav-wrap {
          position: relative;
        }
      }

      @media (max-width: 760px) {
        .resume-toolbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .resume-actions {
          width: 100%;
          justify-content: flex-start;
        }
        .resume-actions .button {
          width: 100%;
        }
        .resume-preview-shell {
          padding: 16px 12px 18px;
        }
      }
    </style>
  </head>
  <body class="resume-page">
    <header class="site-header">
      <div class="container nav-wrap">
        <a href="/" class="brand" aria-label="Go to home page">
          <span class="brand-mark">RJ</span>
          <span class="brand-text">Riya Jadhav</span>
        </a>

        <button class="nav-toggle" type="button" aria-expanded="false" aria-label="Open menu">
          <span></span>
          <span></span>
          <span></span>
        </button>

        <nav class="main-nav" aria-label="Main navigation">
          <a href="/">Home</a>
          <a href="/#about">About</a>
          <a href="/#experience">Experience</a>
          <a href="/#skills">Skills</a>
          <a href="/#projects">Projects</a>
          <a href="/#contact">Contact</a>
          <a href="/resume/" aria-current="page">Resume</a>
        </nav>

        <a class="button button-small" href="/resume/Riya_Jadhav_Resume.pdf" target="_blank" rel="noreferrer">Open PDF</a>
      </div>
    </header>

    <main class="resume-layout">
      <div class="container">
        <section class="resume-card" aria-label="Resume preview section">
          <div class="resume-toolbar">
            <div>
              <p class="eyebrow">Resume</p>
              <h1>Riya Jadhav</h1>
            </div>

            <div class="resume-actions">
              <a class="button" href="/resume/Riya_Jadhav_Resume.pdf" download>Download Resume</a>
              <a class="button button-secondary" href="/resume/Riya_Jadhav_Resume.pdf" target="_blank" rel="noreferrer">Open in New Tab</a>
            </div>
          </div>

          <div class="resume-preview-shell">
            <iframe
              class="resume-frame"
              src="/resume/Riya_Jadhav_Resume.pdf#toolbar=1&navpanes=0&scrollbar=1&view=FitH"
              title="Riya Jadhav resume preview"
              loading="lazy"
            ></iframe>
          </div>
        </section>
      </div>
    </main>

    <script>
      const navToggle = document.querySelector('.nav-toggle');
      const nav = document.querySelector('.main-nav');

      if (navToggle && nav) {
        navToggle.addEventListener('click', () => {
          const isExpanded = navToggle.getAttribute('aria-expanded') === 'true';
          navToggle.setAttribute('aria-expanded', String(!isExpanded));
          nav.classList.toggle('is-open');
        });

        nav.querySelectorAll('a').forEach((link) => {
          link.addEventListener('click', () => {
            nav.classList.remove('is-open');
            navToggle.setAttribute('aria-expanded', 'false');
          });
        });
      }
    </script>
  </body>
</html>
